<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; color: #1f2937; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .subtitle { color: #6b7280; font-size: 13px; margin-bottom: 20px; }
    .cards { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px 18px; min-width: 160px; }
    .card .value { font-size: 24px; font-weight: 700; }
    .card .label { font-size: 12px; color: #6b7280; }
    .card.warn .value { color: #b45309; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 24px; }
    th, td { border: 1px solid #e5e7eb; padding: 8px 10px; font-size: 13px; text-align: left; }
    th { background: #f3f4f6; }
    .loading { color: #6b7280; font-style: italic; }
  </style>
</head>
<body>
  <h1>Control de Pagos a Proveedores</h1>
  <div class="subtitle">Proyecto nuevo e independiente del dashboard de Solicitudes de Orden de Compra.</div>

  <div class="cards" id="cards">
    <div class="loading">Cargando…</div>
  </div>

  <table id="tabla" style="display:none">
    <thead><tr><th>Centro de Costo</th><th>Cantidad de pagos este mes</th></tr></thead>
    <tbody id="tabla-body"></tbody>
  </table>

  <script>
    google.script.run.withSuccessHandler(render).withFailureHandler(showError).getDashboardData();

    function render(data) {
      document.getElementById("cards").innerHTML =
        card(data.mes, "Mes") +
        card(data.totalRegistros, "Pagos cargados") +
        card(data.pendientesDeClasificar, "Proveedores sin clasificar", data.pendientesDeClasificar > 0);

      var body = document.getElementById("tabla-body");
      body.innerHTML = "";
      Object.keys(data.porCentroCosto).sort().forEach(function (cc) {
        var tr = document.createElement("tr");
        tr.innerHTML = "<td>" + esc(cc) + "</td><td>" + data.porCentroCosto[cc].length + "</td>";
        body.appendChild(tr);
      });
      document.getElementById("tabla").style.display = "";
    }

    function card(value, label, warn) {
      return '<div class="card' + (warn ? " warn" : "") + '"><div class="value">' + esc(value) + '</div><div class="label">' + esc(label) + '</div></div>';
    }

    function showError(err) {
      document.getElementById("cards").innerHTML = '<div style="color:#b91c1c">Error: ' + esc(err.message || err) + '</div>';
    }

    function esc(s) {
      var div = document.createElement("div");
      div.textContent = String(s);
      return div.innerHTML;
    }
  </script>
</body>
</html>
